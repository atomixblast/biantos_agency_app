version: '3.8'

services:
  web:
    build: .
    container_name: biantos_agency
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=biantos_agency.settings
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000

networks:
  default:
    name: biantos_network
