<c-vars id="" name="" label="Label" class="" options="[]" /> 


<!-- Floating Select -->
<div class="relative {{class}}">
  <select id="{{id}}" class="peer p-3 pe-9 block w-full border border-foreground text-foreground rounded-lg text-sm focus:border-primary focus:ring-primary disabled:opacity-50 disabled:pointer-events-none 
  focus:pt-6
  focus:pb-2
  not-placeholder-shown:pt-6
  not-placeholder-shown:pb-2
  autofill:pt-6
  autofill:pb-2">
    <option selected="">Sélectionner un élément</option>
    {% for option in options %}
    <option selected="">Open this select menu</option>
    {% endfor %}
  </select>
  <label for="{{id}}" class="absolute top-0 start-0 p-4 h-full truncate pointer-events-none transition ease-in-out duration-100 border border-transparent dark:text-white peer-disabled:opacity-50 peer-disabled:pointer-events-none
    peer-focus:text-xs
    peer-focus:-translate-y-1.5
    peer-focus:text-gray-500 dark:peer-focus:text-neutral-500
    peer-not-placeholder-shown:text-xs
    peer-not-placeholder-shown:-translate-y-1.5
    peer-not-placeholder-shown:text-gray-500 dark:peer-not-placeholder-shown:text-neutral-500 ">{{label}}</label>
</div>
<!-- End Floating Select -->
