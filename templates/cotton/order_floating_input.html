<div class="relative {{class}}">
    <input name="{{name}}" type="{{type}}" id="{{id}}" class="h-12 pt-4 px-5 peer placeholder-transparent focus:border-none text-foreground text-lg focus:ring-0 focus:outline-0 rounded-xl" placeholder="{{placeholder}}">
    <label for="{{id}}" class="absolute top-1 left-3 text-sm text-muted-foreground
            peer-placeholder-shown:text-base peer-placeholder-shown:text-muted-foreground
            peer-placeholder-shown:top-3 transition-all duration-200 ease-in-out peer-focus:top-1 peer-focus:text-sm peer-focus:text-primary">{{label}}</label>
</div>
<!-- End Floating Input -->
