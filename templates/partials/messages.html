{% if messages %}
<div class="max-w-7xl mx-auto pt-6 space-y-2">
  {% for message in messages %}
  <div class="p-3 rounded-lg flex items-center gap-2 text-sm border
    {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800 dark:bg-red-900/20 dark:border-red-800 dark:text-red-300
    {% elif message.tags == 'warning' %}bg-orange-50 border-orange-200 text-orange-800 dark:bg-orange-900/20 dark:border-orange-800 dark:text-orange-300
    {% else %}bg-green-50 border-green-200 text-green-800 dark:bg-green-900/20 dark:border-green-800 dark:text-green-300{% endif %}">
    {% if message.tags == 'error' %}{% icon "circle-alert" %}{% elif message.tags == 'warning' %}{% icon "triangle-alert" %}{% else %}{% icon "circle-check" %}{% endif %}
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
